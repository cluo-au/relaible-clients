<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Millform Australia &middot; Your RelAIble hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#FFFFFF;--forest:#215129;--gold:#198F46;--bg:#F5F7F5;--line:#DFE6EF;--muted:#66748A;--err:#C0392B}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);font-family:Roboto,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#13202D}
.top{background:var(--deep);padding:12px 24px}
.top img{height:52px;display:block}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(6,32,54,.07)}
h1{font-family:"Libre Baskerville",Georgia,serif;font-weight:400;font-size:24px;color:var(--forest);margin:0 0 8px}
p{margin:0 0 22px;color:var(--muted);font-size:14.5px;line-height:1.5}
.digits{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.digits input{width:52px;height:60px;border:2px solid var(--line);border-radius:12px;text-align:center;font-size:26px;font-weight:700;color:var(--forest);font-family:inherit;outline:none}
.digits input:focus{border-color:var(--gold)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.msg{min-height:20px;font-size:13px;color:var(--err)}
.bar{height:4px;background:var(--gold)}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<div class="top"><img src="millform-logo.png" alt="Millform Australia"></div>
<div class="wrap"><div class="card">
  <h1>Your project hub</h1>
  <p>Enter your 4-digit code to open it.</p>
  <form id="f" autocomplete="off">
    <div class="digits" id="d">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 1" id="d1">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 2" id="d2">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 3" id="d3">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 4" id="d4">
    </div>
  </form>
  <div class="msg" id="m" role="status"></div>
</div></div>
<div class="bar"></div>

async function tryCode(code){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
var KEY='hub-code:'+location.pathname;
(async function(){try{var c=sessionStorage.getItem(KEY);if(c){show(await tryCode(c));}}catch(e){}})();
var ins=[].slice.call(document.querySelectorAll('.digits input'));
ins[0].focus();
ins.forEach(function(el,i){
  el.addEventListener('input',function(){el.value=el.value.replace(/\D/g,'').slice(0,1);if(el.value&&i<3)ins[i+1].focus();check();});
  el.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!el.value&&i>0)ins[i-1].focus();});
  el.addEventListener('paste',function(e){var t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);if(t.length){e.preventDefault();t.split('').forEach(function(ch,j){ins[j].value=ch;});ins[Math.min(t.length,3)].focus();check();}});
});
async function check(){
  var code=ins.map(function(x){return x.value;}).join('');
  if(code.length<4)return;
  document.getElementById('m').textContent='Checking...';
  try{var html=await tryCode(code);try{sessionStorage.setItem(KEY,code);}catch(e){}show(html);}
  catch(e){document.getElementById('m').textContent='That code is not right. Try again.';var d=document.getElementById('d');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');ins.forEach(function(x){x.value='';});ins[0].focus();}
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();check();});
</script>
</body>
